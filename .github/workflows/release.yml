name: Release

# Builds an installable app archive when a version tag is pushed (git tag v0.13.0-beta && git push --tags).
# The archive contains the built frontend and the PDF library, so it can be unpacked into custom_apps/ as it is.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, dom, xml, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check that the tag matches appinfo/info.xml
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the app version v${version} in appinfo/info.xml" >&2
            exit 1
          fi

      - name: Production PHP dependencies
        run: composer update --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Assemble the archive
        run: |
          mkdir -p dist-release/verein
          cp -r appinfo lib templates img l10n vendor LICENSE LICENSES REUSE.toml AUTHORS.md README.md CHANGELOG.md SECURITY.md dist-release/verein/
          mkdir -p dist-release/verein/js
          cp -r js/dist dist-release/verein/js/
          tar -czf "verein-${GITHUB_REF_NAME}.tar.gz" -C dist-release verein

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: verein-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
