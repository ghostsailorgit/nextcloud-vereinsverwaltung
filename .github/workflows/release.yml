name: Release

# Builds an installable app archive when a version tag is pushed (git tag v0.13.0-beta && git push --tags).
# The archive contains the built frontend and the PDF library, so it can be unpacked into custom_apps/ as it is.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'  # lowest supported: composer then only picks dependencies that run on all versions
          extensions: mbstring, intl, bcmath, dom, xml, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'  # LTS; Node 25 is end of life, 26 becomes LTS on 2026-10-28
          cache: npm

      - name: Check that the tag matches appinfo/info.xml
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the app version v${version} in appinfo/info.xml" >&2
            exit 1
          fi

      - name: Build the archive (frontend, production PHP dependencies)
        run: scripts/build-archive.sh "verein-${GITHUB_REF_NAME}.tar.gz"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: verein-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
