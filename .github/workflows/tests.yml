name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: phpunit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the lowest (Nextcloud 33 needs 8.2) and the highest supported PHP version
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, bcmath, dom, xml, zip
          coverage: none

      # composer.lock is not committed, so resolve fresh; the OCP stubs are pinned to the oldest supported
      # Nextcloud (composer.json: dev-stable33), so an API that only exists in newer versions fails here
      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      # official ISO 20022 schema of the SEPA file (not committed: ISO licence); SepaServiceTest validates the
      # generated XML against it and fails in CI without it. Pinned to a commit and a checksum.
      - name: SEPA schema (pain.008.001.02)
        run: |
          curl -fsSL --retry 3 --create-dirs -o tests/fixtures/pain.008.001.02.xsd \
            https://raw.githubusercontent.com/php-sepa-xml/php-sepa-xml/e5cfc5748cec9b02f7d3ca06012bf150ad3c8c2e/doc/ISO20022/pain/008/001/pain.008.001.02.xsd
          echo "1ce9e574ad74f48e33d956d876bfe32c7aa9cd57aef95941cdbf251b0fc6d9ad  tests/fixtures/pain.008.001.02.xsd" | sha256sum -c -

      - name: Unit tests
        run: vendor/bin/phpunit

      # also fails on compile-time deprecations of this PHP version (e.g. implicitly nullable parameters since 8.4,
      # which Nextcloud logs as errors on every request that hits them)
      - name: Syntax check, no deprecations
        run: |
          out=$(find lib appinfo scripts tests -name '*.php' -print0 | xargs -0 -n1 php -d error_reporting=-1 -d display_errors=stderr -l 2>&1 | grep -v '^No syntax errors detected' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Known vulnerabilities in PHP dependencies
        run: composer audit --no-dev

  # The app inside a real Nextcloud: install, enable (runs all migrations), then tests/Integration/smoke.php against
  # the real database, calendar and app data, HTTP requests through routing/middleware as admin and as a non-admin,
  # and a backup restore with occ. The versions and databases here are what appinfo/info.xml may claim.
  integration:
    name: Nextcloud ${{ matrix.server }} / ${{ matrix.db }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: stable33, php: '8.2', db: sqlite }
          - { server: stable33, php: '8.2', db: mysql }
          - { server: stable34, php: '8.4', db: pgsql }
          - { server: stable34, php: '8.5', db: mariadb }
          - { server: stable35, php: '8.3', db: mysql }
          - { server: stable35, php: '8.4', db: sqlite }
          - { server: stable35, php: '8.5', db: pgsql }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: rootpassword, MYSQL_DATABASE: nextcloud }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: rootpassword, MARIADB_DATABASE: nextcloud }
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: rootpassword, POSTGRES_USER: root, POSTGRES_DB: nextcloud }
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - name: Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server }}
          submodules: true
          path: server

      - name: The app
        uses: actions/checkout@v4
        with:
          path: server/apps/verein

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, iconv, fileinfo, intl, gd, zip, curl, xml, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/apps/verein/package-lock.json

      - name: App dependencies and frontend (as in the release archive)
        working-directory: server/apps/verein
        run: |
          composer update --no-dev --no-interaction --no-progress
          npm ci
          npm run build

      - name: Install Nextcloud
        working-directory: server
        run: |
          case "${{ matrix.db }}" in
            sqlite)  DBARGS="--database=sqlite" ;;
            mysql)   DBARGS="--database=mysql --database-host=127.0.0.1 --database-port=3306 --database-user=root --database-pass=rootpassword --database-name=nextcloud" ;;
            mariadb) DBARGS="--database=mysql --database-host=127.0.0.1 --database-port=3307 --database-user=root --database-pass=rootpassword --database-name=nextcloud" ;;
            pgsql)   DBARGS="--database=pgsql --database-host=127.0.0.1 --database-port=5432 --database-user=root --database-pass=rootpassword --database-name=nextcloud" ;;
          esac
          php occ maintenance:install --admin-user=admin --admin-pass=admin $DBARGS
          php occ app:enable verein
          test "$(php occ config:app:get verein enabled)" = "yes"
          OC_PASS=ci-user-password php occ user:add --password-from-env ci-user

      - name: Smoke test (services against the real database)
        working-directory: server
        run: php apps/verein/tests/Integration/smoke.php run

      - name: HTTP through routing and the permission middleware
        working-directory: server
        run: |
          php -S 127.0.0.1:8080 > /tmp/php-server.log 2>&1 &
          sleep 3
          CLUB=$(php -r 'echo json_decode(file_get_contents("apps/verein/tests/Integration/smoke-state.json"), true)["clubId"];')
          OTHER=$(php -r 'echo json_decode(file_get_contents("apps/verein/tests/Integration/smoke-state.json"), true)["otherClubId"];')
          req() { # expected-status user:password method path [body]
            code=$(curl -s -o /tmp/body -w '%{http_code}' -u "$2" -H 'OCS-APIRequest: true' -X "$3" \
              -H 'Content-Type: application/x-www-form-urlencoded' ${5:+--data "$5"} "http://127.0.0.1:8080/index.php/apps/verein$4")
            if [ "$code" != "$1" ]; then echo "FAIL $3 $4 as ${2%%:*}: expected $1, got $code: $(head -c 300 /tmp/body)"; exit 1; fi
            echo "ok   $3 $4 as ${2%%:*} -> $code"
          }
          A=admin:admin; U=ci-user:ci-user-password
          req 200 $A GET "/clubs"
          req 200 $A GET "/members?clubId=$CLUB"
          req 200 $A GET "/audit-log?clubId=$CLUB"
          req 200 $A POST "/fee-run/preview" "clubId=$CLUB&year=2026&dueDate=2026-03-31&prorata=1"
          req 400 $A GET "/dunning/letters?clubId=$CLUB&feeIds=0&deadlineDays=14"
          # the non-admin holds finance rights in $CLUB only
          req 200 $U POST "/dunning/preview" "clubId=$CLUB&overdueDays=14&intervalDays=14"
          req 200 $U GET "/finance?clubId=$CLUB"
          req 403 $U GET "/members?clubId=$CLUB"
          req 403 $U POST "/members/import/preview" "clubId=$CLUB&csv=Name%0AX"
          req 403 $U GET "/audit-log?clubId=$CLUB"
          req 403 $U POST "/dunning/preview" "clubId=$OTHER&overdueDays=14&intervalDays=14"
          req 403 $U GET "/finance?clubId=$OTHER"
          req 401 "nobody:wrong" GET "/clubs"

      - name: Club calendar (public calendar-provider API) and removal of the old stored calendar
        working-directory: server
        run: |
          php apps/verein/tests/Integration/smoke.php calendar
          CLUB=$(php -r 'echo json_decode(file_get_contents("apps/verein/tests/Integration/smoke-state.json"), true)["clubId"];')
          php -S 127.0.0.1:8081 > /tmp/php-server-cal.log 2>&1 &
          sleep 3
          PROPS='<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:displayname/></d:prop></d:propfind>'
          curl -s -u ci-user:ci-user-password -X PROPFIND -H 'Depth: 1' --data "$PROPS" \
            "http://127.0.0.1:8081/remote.php/dav/calendars/ci-user/" > /tmp/home.xml
          grep -q "verein-club-$CLUB/" /tmp/home.xml || { echo "FAIL app calendar not in ci-user's calendar home"; head -c 1500 /tmp/home.xml; exit 1; }
          HREF=$(grep -oE "/remote.php/dav/calendars/ci-user/[^<]*verein-club-$CLUB/" /tmp/home.xml | head -1)
          N=$(curl -s -u ci-user:ci-user-password -X PROPFIND -H 'Depth: 1' --data "$PROPS" "http://127.0.0.1:8081$HREF" | grep -o '\.ics</d:href>' | wc -l)
          test "$N" = "8" || { echo "FAIL expected 8 objects over CalDAV, got $N"; exit 1; }
          echo "ok   CalDAV: $HREF with $N events"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -u ci-user:ci-user-password -X PUT --data 'BEGIN:VCALENDAR' "http://127.0.0.1:8081${HREF}x.ics")
          test "$CODE" = "403" && echo "ok   CalDAV write refused ($CODE)" || { echo "FAIL write answered $CODE"; exit 1; }
          if curl -s -u admin:admin -X PROPFIND -H 'Depth: 1' --data "$PROPS" "http://127.0.0.1:8081/remote.php/dav/calendars/admin/" | grep -q "verein-club-$CLUB/"; then
            echo "FAIL admin (not in the calendar group) sees the club calendar"; exit 1
          fi
          echo "ok   admin (not in the group) does not see it"
          if grep -E '"level":[34]' data/nextcloud.log 2>/dev/null | grep -iE 'Undefined array key|AppCalendar|verein' ; then echo "FAIL warnings in nextcloud.log"; exit 1; fi
          echo "ok   no calendar warnings in nextcloud.log"

      - name: appinfo/info.xml matches Nextcloud's schema
        run: |
          php -r 'libxml_use_internal_errors(true); $d = new DOMDocument(); $d->load($argv[1]);
            if ($d->schemaValidate($argv[2])) { echo "ok   info.xml is valid\n"; exit(0); }
            foreach (libxml_get_errors() as $e) { echo "line $e->line: " . trim($e->message) . "\n"; } exit(1);' \
            server/apps/verein/appinfo/info.xml server/resources/app-info.xsd

      - name: Backup restore with occ
        working-directory: server
        run: |
          BACKUP=$(php -r 'echo json_decode(file_get_contents("apps/verein/tests/Integration/smoke-state.json"), true)["backup"];')
          php occ verein:backup:list
          php apps/verein/tests/Integration/smoke.php mutate
          php occ verein:backup:restore "$BACKUP" --yes
          php apps/verein/tests/Integration/smoke.php verify

      - name: Nextcloud log on failure
        if: failure()
        run: tail -n 60 server/data/nextcloud.log || true; tail -n 30 /tmp/php-server.log || true

  # What an administrator without a shell gets: the release archive (scripts/build-archive.sh, the same script as
  # release.yml), unpacked into a separate custom_apps/ folder of a fresh Nextcloud and enabled - no composer or npm
  # on the server, nothing from the git checkout. Then the smoke test (incl. PDF with the pruned TCPDF) and the
  # background jobs through Nextcloud's webcron (cron.php over HTTP, one job per request - no system cron).
  archive:
    name: Release archive on Nextcloud ${{ matrix.server }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: stable33, php: '8.2' }
          - { server: stable35, php: '8.5' }
    steps:
      - name: The app (only to build the archive)
        uses: actions/checkout@v4
        with:
          path: app

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, iconv, fileinfo, intl, gd, zip, curl, xml, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the archive
        run: app/scripts/build-archive.sh verein.tar.gz

      - name: Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server }}
          submodules: true
          path: server

      - name: Install Nextcloud with a separate, writable custom_apps folder
        working-directory: server
        run: |
          php occ maintenance:install --admin-user=admin --admin-pass=admin --database=sqlite
          mkdir custom_apps
          # as the official Docker image does it: both entries at once (occ config:system:set one key at a time
          # leaves a half entry without "url" in between, and Nextcloud then finds no apps folder at all)
          printf '%s\n' '<?php' '$CONFIG = ["apps_paths" => [' \
            '  ["path" => OC::$SERVERROOT . "/apps", "url" => "/apps", "writable" => false],' \
            '  ["path" => OC::$SERVERROOT . "/custom_apps", "url" => "/custom_apps", "writable" => true],' \
            ']];' > config/apps.config.php
          php occ status

      - name: Unpack the archive and enable the app
        working-directory: server
        run: |
          tar -xzf ../verein.tar.gz -C custom_apps
          php occ app:enable verein
          test "$(php occ app:getpath verein)" = "$PWD/custom_apps/verein" || { echo "FAIL app not loaded from custom_apps"; exit 1; }
          test "$(php occ config:app:get verein enabled)" = "yes"
          echo "ok   enabled from custom_apps ($(du -sh custom_apps/verein | cut -f1) unpacked)"

      - name: Smoke test against the installed archive
        working-directory: server
        run: |
          # the archive has no tests; put the smoke test next to the installed app for this run only
          cp -r ../app/tests custom_apps/verein/tests
          OC_PASS=ci-user-password php occ user:add --password-from-env ci-user
          php custom_apps/verein/tests/Integration/smoke.php run

      - name: Background jobs through webcron (no system cron)
        working-directory: server
        run: |
          php occ background:webcron
          php -S 127.0.0.1:8082 > /tmp/php-server-cron.log 2>&1 &
          sleep 3
          before=$(php occ verein:backup:list | grep -c '^verein-backup' || true)
          for i in $(seq 1 200); do
            curl -s -o /dev/null "http://127.0.0.1:8082/cron.php"
            now=$(php occ verein:backup:list | grep -c '^verein-backup' || true)
            if [ "$now" -gt "$before" ]; then echo "ok   daily backup ran through webcron after $i requests"; exit 0; fi
          done
          echo "FAIL the daily backup job did not run through webcron"; exit 1

      - name: Nextcloud log on failure
        if: failure()
        run: tail -n 60 server/data/nextcloud.log || true; tail -n 30 /tmp/php-server-cron.log || true

  reuse:
    name: REUSE (licence of every file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reuse lint
        run: pipx run reuse lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Known vulnerabilities in JavaScript dependencies
        run: npm audit --omit=dev

  # the next LTS (Node 26 becomes LTS on 2026-10-28): the build must already work there, so switching is one line
  frontend-next:
    name: frontend (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
